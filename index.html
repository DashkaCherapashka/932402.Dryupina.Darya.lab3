<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>О себе — Музыкант и звукорежиссёр</title>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="images/ava.jpg"
             alt="Портрет Дарьи Дрюпиной с наушниками"
             width="140" height="140"
             class="avatar">
        <h1>Дарья Дрюпина</h1>
        <p>Музыкант и звукорежиссёр</p>

        <nav class="main-nav">
            <a href="#releases">Релизы</a>
            <a href="#gear">Оборудование</a>
            <a href="#contact">Контакты</a>
        </nav>
    </header>

    <main>

        <section id="releases" class="releases-section">
            <h2>Мои релизы</h2>

            <div class="releases-grid">
                <article class="release-card">
                    <img src="images/cover1.jpg" alt="Обложка сингла Работа" class="release-cover">
                    <div class="release-info">
                        <h3>Работа</h3>
                        <p class="release-type">Сингл</p>
                        <p class="release-meta">
                            <time datetime="2025">2026</time> · lo-fi
                        </p>
                    </div>
                </article>

                <article class="release-card">
                    <img src="images/cover2.jpg" alt="Обложка сингла Грусть" class="release-cover">
                    <div class="release-info">
                        <h3>Грусть</h3>
                        <p class="release-type">Сингл</p>
                        <p class="release-meta">
                            <time datetime="2024">2026</time> · инди
                        </p>
                    </div>
                </article>

                <article class="release-card">
                    <img src="images/cover3.jpg" alt="Обложка сингла Вдохновение" class="release-cover">
                    <div class="release-info">
                        <h3>Вдохновение</h3>
                        <p class="release-type">Сингл</p>
                        <p class="release-meta">
                            <time datetime="2024">2026</time> · ambient
                        </p>
                    </div>
                </article>

                <article class="release-card">
                    <img src="images/cover4.jpg" alt="Обложка сингла Радость" class="release-cover">
                    <div class="release-info">
                        <h3>Радость</h3>
                        <p class="release-type">Сингл</p>
                        <p class="release-meta">
                            <time datetime="2023">2026</time> · поп
                        </p>
                    </div>
                </article>
            </div>
        </section>
    </main>

</body>
</html>
